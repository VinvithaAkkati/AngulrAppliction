<div class="filter-container">
    <span>Filter: </span>

    <input type="radio" name="filter" value="all" [(ngModel)]="selectedFilterRadioButton" (change)="onSelectedFilterRadioButtonChanged()"/>
    <span>{{'All ('+all+')'}}</span>

    <input type="radio" name="filter" value="In_Stock" [(ngModel)]="selectedFilterRadioButton" (change)="onSelectedFilterRadioButtonChanged()" />
    <span>{{'In stock ('+inStock+')'}}</span>

    <input type="radio" name="filter" value="Out_of_Stock" [(ngModel)]="selectedFilterRadioButton" (change)="onSelectedFilterRadioButtonChanged()"/>
    <span>{{'Out of Stock ('+outOfStock+')'}}</span>
</div>
